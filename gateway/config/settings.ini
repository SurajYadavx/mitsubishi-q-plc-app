[plc]
# Mitsubishi Q03UDECPU on the lab LAN
ip              = 192.168.3.39
port            = 5010
# MC Protocol 3E frame, binary mode preferred
protocol        = 3E
timeout_sec     = 3.0
poll_interval_sec = 1.0
max_retry       = 5
retry_delay_sec = 2.0

[devices]
# Inputs to read (Q-series X device, hexadecimal addressing X0-X7)
inputs  = X0,X1,X2,X3,X4,X5,X6,X7
# Outputs to read (Q-series Y device, hexadecimal addressing Y20-Y27)
outputs = Y20,Y21,Y22,Y23,Y24,Y25,Y26,Y27

[serial]
port       = COM9
baud_rate  = 115200
timeout_sec = 1.0

[gateway]
id          = plc-gw-01
# Emit heartbeat every N seconds even if no device change detected
heartbeat_sec = 5
